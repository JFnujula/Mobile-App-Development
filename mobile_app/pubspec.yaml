name: rh_predictor
description: Mobile client for the private Relative Humidity prediction API (notebook model -> FastAPI).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"   # Flutter >= 3.32 (DropdownButtonFormField.initialValue)

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2     # tokens live in Android Keystore / iOS Keychain, never in plain prefs

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
